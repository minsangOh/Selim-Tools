# 원본 저장소의 릴리스를 Selim Tools에 올린다 (tools/publish.py).
# 원본 저장소의 .github/workflows/selim-tools.yml이 정식 릴리스를 만들 때마다 부른다.
name: Selim Tools에 올리기

on:
  workflow_call:
    inputs:
      app:
        description: manifest.json의 앱 id
        required: true
        type: string
      tag:
        description: 원본 저장소의 릴리스 태그
        required: true
        type: string
    secrets:
      token:
        description: Selim-Tools에 릴리스를 만들고 푸시할 수 있는 토큰
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # 부른 원본 저장소가 아니라 이 저장소를 받는다. manifest.json도 이 토큰으로 푸시한다
      - uses: actions/checkout@v7
        with:
          repository: minsangOh/Selim-Tools
          token: ${{ secrets.token }}
          fetch-depth: 0
      - name: 릴리스 올리기
        env:
          GH_TOKEN: ${{ secrets.token }}
          # 원본 저장소는 비공개라 그 저장소의 워크플로 토큰으로 릴리스를 받는다
          SOURCE_GH_TOKEN: ${{ github.token }}
          APP: ${{ inputs.app }}
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/publish.py "$APP" --tag "$TAG" --yes
